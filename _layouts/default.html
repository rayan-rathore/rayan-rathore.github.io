<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cloudflare.com"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}" style="color: #fff; text-decoration: none;">{{ site.title | default: site.github.repository_name }}</a></h1>
        <p>{{ site.description }}</p>
        
        <!-- Clean Professional Navigation Sidebar Menu -->
        <nav style="margin-top: 30px;">
          <ul style="list-style: none; padding: 0; margin: 0;">
            <li style="margin-bottom: 12px;"><a href="{{ '/' | relative_url }}" style="color: #9f9; text-decoration: none; font-weight: bold;">[~] Dashboard</a></li>
            <li style="margin-bottom: 12px;"><a href="{{ '/about.html' | relative_url }}" style="color: #9f9; text-decoration: none;">[?] About Me</a></li>
            <li style="margin-bottom: 12px;"><a href="{{ '/projects.html' | relative_url }}" style="color: #9f9; text-decoration: none;">[/] Projects</a></li>
            <li style="margin-bottom: 12px;"><a href="{{ '/contact.html' | relative_url }}" style="color: #9f9; text-decoration: none;">[@] Contact</a></li>
          </ul>
        </nav>
      </header>
      
      <section>
        {{ content }}
      </section>
      
      <footer>
        <!-- Clean minimalist footer with no automated credits -->
        <p style="font-size: 0.8rem; color: #555;">&copy; {{ site.time | date: "%Y" }} Rayan Rathore. Secure Shell Active.</p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
